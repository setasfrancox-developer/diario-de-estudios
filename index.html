<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Diario de estudio</h1>

    <!-- Estadísticas: racha actual, últimos 7 días, mejor racha, minutos semanales y días del mes -->
    <section class="streak-card" aria-labelledby="streak-label">
      <div class="streak-hero">
        <span class="fire" aria-hidden="true">🔥</span>
        <span class="streak-number" id="streak">0</span>
        <span class="streak-label" id="streak-label">días seguidos</span>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat__value" id="best-streak">0</span>
          <span class="stat__label">Mejor racha</span>
        </div>
        <div class="stat">
          <span class="stat__value" id="week-minutes">0</span>
          <span class="stat__label">Minutos esta semana</span>
        </div>
        <div class="stat">
          <span class="stat__value" id="month-days">0</span>
          <span class="stat__label">Días este mes</span>
        </div>
      </div>

      <!-- Objetivo semanal de estudio -->
      <div class="goal-block">
        <p class="goal-invite" id="goal-invite">Fija un objetivo semanal para seguir tu progreso</p>
        <div class="goal-progress" id="goal-progress" hidden>
          <span class="goal-text" id="goal-text">0 / 0 min</span>
          <div class="goal-bar" id="goal-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso del objetivo semanal">
            <div class="goal-bar__fill" id="goal-bar-fill"></div>
          </div>
          <span class="goal-complete" id="goal-complete" hidden>Objetivo cumplido</span>
        </div>
        <form id="goal-form" class="goal-form">
          <input type="number" id="goal-input" min="1" step="1" placeholder="Minutos por semana">
          <button type="submit">Guardar objetivo</button>
        </form>
        <p class="goal-error" id="goal-error" aria-live="polite"></p>
      </div>
    </section>

    <!-- Mapa de calor de las últimas 12 semanas -->
    <section class="card heatmap-card" aria-labelledby="heatmap-title">
      <h2 id="heatmap-title">Últimas 12 semanas</h2>
      <div class="heatmap-grid" id="heatmap-grid" role="grid" aria-rowcount="7" aria-colcount="12"></div>
      <p class="heatmap-detail" id="heatmap-detail" aria-live="polite"></p>
      <div class="heatmap-legend" id="heatmap-legend" aria-label="Leyenda de intensidad"></div>
    </section>

    <!-- Formulario para registrar una sesión de estudio -->
    <section class="card">
      <h2>Nueva sesión</h2>
      <form id="session-form">
        <label>
          Fecha
          <input type="date" id="date" required>
        </label>
        <label>
          Tema
          <input type="text" id="topic" required placeholder="Ej: JavaScript">
        </label>
        <label>
          Minutos
          <input type="number" id="minutes" min="1" required placeholder="30">
        </label>
        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <!-- Lista de sesiones, de la más reciente a la más antigua -->
    <section class="card">
      <h2>Sesiones</h2>
      <ul id="sessions" class="session-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
